name = "mcp-server-enterprise"
main = "src/entry.py"
compatibility_date = "2024-09-23"
compatibility_flags = ["python_workers"]

# 🌐 Cloudflare Workers Dev (Habilita subdomínio padrão *.workers.dev)
workers_dev = true

# 🌐 Domínio Customizado (Opcional - descomente e preencha com seu próprio domínio)
# routes = [
#   { pattern = "mcp-server.seu-dominio.com", custom_domain = true }
# ]

[observability]
enabled = true

# 🔒 Variáveis de Ambiente & Secrets
# NOTA DE SEGURANÇA: Nunca exponha tokens, IDs de conta ou senhas neste arquivo.
# - Desenvolvimento local: utilize o arquivo '.dev.vars' (ignorado pelo git).
# - Produção (Cloudflare): configure os segredos via 'npx wrangler secret put <NOME>'
#   (ex: REDIS_URL, GMAIL_APP_PASSWORD, RESEND_API_KEY, GOOGLE_CLIENT_SECRET).
[vars]
RESEND_FROM = "MCP Server Enterprise <acesso@seu-dominio.com>"
