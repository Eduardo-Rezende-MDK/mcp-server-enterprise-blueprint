[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-server-enterprise"
version = "1.0.0"
description = "Blueprint corporativo para servidores MCP em Python com FastMCP e tipagem estrita Pydantic"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.3.0",
    "fastmcp>=0.4.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src", "."]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
